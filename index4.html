<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Transit Departures</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-train: #ff5722;
            --accent-bus: #00bcd4;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .dashboard {
            width: 100%;
            max-width: 800px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        .time {
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        .board {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .board h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .train-title { color: var(--accent-train); }
        .bus-title { color: var(--accent-bus); }
        
        .departure-item {
            display: grid;
            grid-template-columns: 60px 1fr 100px;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            align-items: center;
        }
        .departure-item:last-child {
            border-bottom: none;
        }
        .dep-time {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .dep-destination {
            font-size: 1.1rem;
        }
        .dep-status {
            text-align: right;
            font-weight: bold;
        }
        .status-on-time { color: #4caf50; }
        .status-delayed { color: #f44336; }
        .status-expected { color: #ffeb3b; }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>Port Glasgow Transit</h1>
        <div class="time" id="clock">00:00:00</div>
    </header>

    <div class="board" id="train-board">
        <h2 class="train-title">🚆 Live Trains (Port Glasgow Station)</h2>
        <div id="train-list" class="loading">Loading departures...</div>
    </div>

    <div class="board" id="bus-board">
        <h2 class="bus-title">🚌 Live Buses (Coronation Park)</h2>
        <div id="bus-list" class="loading">Loading departures...</div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // Get your free API keys at https://developer.transportapi.com/
    const APP_ID = 'YOUR_APP_ID_HERE';
    const APP_KEY = 'YOUR_APP_KEY_HERE';
    const USE_REAL_API = false; // Change to true once you have API keys

    // Station/Stop Codes for Port Glasgow
    const TRAIN_STATION_CODE = 'PTG'; // Port Glasgow rail station
    const BUS_STOP_ATCO = '61501625'; // Example ATCO code for a central Port Glasgow bus stop

    // --- CLOCK ---
    function updateClock() {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- DATA FETCHING & RENDERING ---
    async function fetchDepartures() {
        if (USE_REAL_API) {
            try {
                // Fetch Trains
                const trainRes = await fetch(`https://transportapi.com/v3/uk/train/station/${TRAIN_STATION_CODE}/live.json?app_id=${APP_ID}&app_key=${APP_KEY}`);
                const trainData = await trainRes.json();
                renderDepartures('train-list', parseTrainData(trainData));

                // Fetch Buses
                const busRes = await fetch(`https://transportapi.com/v3/uk/bus/stop/${BUS_STOP_ATCO}/live.json?app_id=${APP_ID}&app_key=${APP_KEY}`);
                const busData = await busRes.json();
                renderDepartures('bus-list', parseBusData(busData));
            } catch (error) {
                document.getElementById('train-list').innerHTML = `<div class="loading status-delayed">Error fetching data. Check console.</div>`;
                console.error("API Error:", error);
            }
        } else {
            // Load Demo Data
            renderDepartures('train-list', getDemoTrainData());
            renderDepartures('bus-list', getDemoBusData());
        }
    }

    function renderDepartures(elementId, departures) {
        const container = document.getElementById(elementId);
        if (departures.length === 0) {
            container.innerHTML = '<div class="loading">No upcoming departures found.</div>';
            return;
        }

        container.innerHTML = departures.map(dep => `
            <div class="departure-item">
                <div class="dep-time">${dep.time}</div>
                <div class="dep-destination">${dep.destination}</div>
                <div class="dep-status ${getStatusClass(dep.status)}">${dep.status}</div>
            </div>
        `).join('');
    }

    function getStatusClass(status) {
        const s = status.toLowerCase();
        if (s === 'on time') return 'status-on-time';
        if (s.includes('late') || s.includes('cancelled')) return 'status-delayed';
        return 'status-expected';
    }
