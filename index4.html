<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <title>Departures</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            /* Use dvh to prevent Android address bar from clipping the bottom iframe */
            height: 100dvh; 
            overflow: hidden;
            font-family: sans-serif;
            background-color: #111; 
        }

        /* Mobile-First Grid Layout */
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 60px 40px 1fr 40px 1fr;
            height: 100%;
            width: 100%;
        }

        .top-bar {
            background-color: #0a0a0a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            border-bottom: 2px solid #333;
            font-family: 'Courier New', Courier, monospace;
        }

        .board-title {
            color: #ffcc00;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #ffcc00;
        }

        .clock {
            color: #ff3333;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 8px #ff3333;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            z-index: 10;
        }

        .bus-header { background-color: #005eb8; }
        .train-header { background-color: #1e467d; }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="top-bar">
            <div class="board-title">Departures</div>
            <div class="clock" id="live-clock">00:00:00</div>
        </div>

        <div class="header bus-header">McGill's 532 (Live Map)</div>
        <div id="bus-frame">
            <iframe src="https://bustimes.org/services/532-greenock-devol-via-gallagher-retail-park-por-2#map" title="Bus Map"></iframe>
        </div>

        <div class="header train-header">Trains to Glasgow</div>
        <div id="train-frame">
            <iframe src="https://www.realtimetrains.co.uk/search/detailed/gb-nr:PTG/to/gb-nr:GLC" title="Train Times"></iframe>
        </div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-GB', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            document.getElementById('live-clock').innerText = timeString;
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
